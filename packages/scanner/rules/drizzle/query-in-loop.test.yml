id: drizzle/query-in-loop
invalid:
  - "async function f(ids: string[]) { for (const id of ids) { await db.select().from(users).where(eq(users.id, id)); } }"
  - "async function f(ids: string[]) { return Promise.all(ids.map((id) => db.select().from(users).where(eq(users.id, id)))); }"
  - "async function f(rows: R[]) { for (const r of rows) { await db.update(t).set({ a: 1 }).where(eq(t.id, r.id)); } }"
  - "async function f(rows: R[]) { for (const r of rows) { await tx.delete(t).where(eq(t.id, r.id)); } }"
  - "async function f(rows: R[]) { rows.forEach(async (r) => { await db.insert(t).values(r); }); }"
  - "async function f(ids: string[]) { for (const id of ids) { await db.query.users.findFirst({ where: eq(users.id, id) }); } }"
  - "async function f(ids: string[]) { const out = ids.map(async (id) => db.query.users.findMany({ limit: 1 })); }"
  - "async function f(n: number) { let i = 0; while (i < n) { await db.insert(t).values({ i }).returning(); i++; } }"
  - "async function f(chunks: R[][]) { for (const chunk of chunks) { await db.update(t).set({ a: 1 }).where(eq(t.id, chunk.id)); } }"
valid:
  - "async function f(ids: string[]) { return db.select().from(users).where(inArray(users.id, ids)); }"
  - "async function f(rows: R[]) { await db.insert(t).values(rows); }"
  - "function f(els: E[]) { els.map((el) => d3.select(el).attr('a', 1)); }"
  - "function f(els: E[]) { for (const el of els) { $(el).select(); } }"
  - "function f(items: I[]) { for (const it of items) { const q = list.select(it); use(q); } }"
  - "function f(items: I[]) { for (const it of items) { jobs.push(() => db.select().from(t)); } }"
  - "async function f(ids: string[]) { for (const id of await db.select().from(users)) { use(id); } }"
  - "async function f() { return db.query.users.findFirst({ where: eq(users.id, 1) }); }"
  - "async function f(chunks: R[][]) { for (const chunk of chunks) { await db.insert(t).values(chunk); } }"
  - "async function f(rows: R[]) { for (let i = 0; i < rows.length; i += BATCH) { await db.insert(t).values(rows.slice(i, i + BATCH)); } }"
  - "async function f(batches: R[][]) { for (const b of batches) { await db.insert(t).values(b); } }"
  - "async function f(rows: R[]) { for (const r of rows) { await db.insert(t).values(batchRow); } }"
  - "async function f(chunks: R[][]) { await Promise.all(chunks.map((c) => db.insert(t).values(c))); }"
