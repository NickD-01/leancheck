id: core/await-in-loop
pack: core
category: perf
severity: medium
confidence: medium
message: await inside a loop runs iterations one after another instead of concurrently.
fixHint: If iterations are independent, collect the promises and use Promise.all (or a concurrency-limited pool). Keep the loop if each iteration needs the previous result (cursor pagination, retries).
rule:
  kind: await_expression
  inside:
    field: body
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
    stopBy:
      any:
        - kind: function_declaration
        - kind: function_expression
        - kind: arrow_function
        - kind: method_definition
        - kind: generator_function_declaration
        - kind: generator_function
