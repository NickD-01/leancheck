id: core/lookup-in-loop
pack: core
category: perf
severity: medium
confidence: medium
message: Linear array lookup inside a loop or iteration callback makes the work quadratic.
fixHint: Build a Map or Set (or an index by key) once before the loop and look up in that.
filter: receiverNotLoopBound
rule:
  kind: call_expression
  has:
    field: function
    kind: member_expression
    all:
      - has:
          field: object
          kind: identifier
      - has:
          field: property
          regex: ^(find|filter|includes|indexOf|some)$
  any:
    - inside:
        stopBy: end
        field: body
        any:
          - kind: for_statement
          - kind: for_in_statement
          - kind: while_statement
    - inside:
        stopBy: end
        any:
          - kind: arrow_function
          - kind: function_expression
        inside:
          kind: arguments
          inside:
            kind: call_expression
            has:
              field: function
              kind: member_expression
              has:
                field: property
                regex: ^(map|forEach|reduce|filter)$
