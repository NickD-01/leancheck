id: prisma/query-in-loop
pack: prisma
category: perf
severity: high
confidence: high
message: "Prisma query inside a loop or iteration callback runs once per item (N+1)."
fixHint: "Fetch all rows in one query (inArray / IN) and join in memory, or use a relational query."
filter: prismaNotBatched
supersedes:
  - core/await-in-loop
rule:
  kind: call_expression
  matches: in-loop
  all:
    - has:
        field: function
        kind: member_expression
        all:
          - has:
              field: property
              regex: ^(findUnique|findFirst|findMany|update|delete|upsert|count|aggregate)$
          - has:
              field: object
              kind: member_expression
              all:
                - has:
                    field: property
                    regex: ^[a-z]
                - has:
                    field: object
                    any:
                      - kind: identifier
                        regex: ^(prisma|db|tx|\w*[Pp]risma\w*)$
                      - kind: member_expression
                        has:
                          field: property
                          regex: ^(prisma|db|tx|\w*[Pp]risma\w*)$
    - any:
        - has:
            field: arguments
            has:
              kind: object
        - has:
            field: arguments
            regex: ^\(\s*\)$
